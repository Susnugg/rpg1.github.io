<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PERSONA CHAT - VISUAL AI</title>
    <style>
        :root { --main: #a29bfe; --bg: #0d0d0d; --panel: #1a1a1a; --user: #00ccff; --ai: #ff9933; }
        body { background: var(--bg); color: #ddd; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }

        #chat-container { width: 95%; max-width: 800px; height: 90vh; background: #111; border: 1px solid #333; display: flex; flex-direction: column; position: relative; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* Creator Screen */
        #setup-screen { padding: 40px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 12px; color: var(--main); font-weight: bold; text-transform: uppercase; }
        textarea, input { background: #1a1a1a; border: 1px solid #333; color: white; padding: 12px; border-radius: 4px; font-family: inherit; }
        textarea { height: 80px; resize: none; }
        
        /* Chat Screen */
        #output { flex-grow: 1; overflow-y: auto; padding: 20px; display: none; scroll-behavior: smooth; }
        .msg { margin-bottom: 20px; max-width: 85%; line-height: 1.5; padding: 12px 16px; border-radius: 12px; }
        .user-msg { align-self: flex-end; background: #222; border-right: 4px solid var(--user); margin-left: auto; }
        .ai-msg { align-self: flex-start; background: #1a1a1a; border-left: 4px solid var(--ai); }
        .msg-label { font-size: 11px; font-weight: bold; margin-bottom: 4px; display: block; opacity: 0.7; }

        #input-area { padding: 20px; background: #000; border-top: 1px solid #333; display: none; gap: 10px; }
        #user-input { flex-grow: 1; }
        
        .start-btn { background: var(--main); color: #000; border: none; padding: 15px; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 10px; }
        .start-btn:hover { background: #b2abff; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="setup-screen">
        <h2 style="color:var(--main); margin-top:0;">PERSONA INITIALIZATION</h2>
        
        <div class="input-group">
            <label>The AI's Character</label>
            <textarea id="ai-desc" placeholder="Describe the AI. Who are they? How do they talk? (e.g. A tired detective from the 1940s)"></textarea>
        </div>

        <div class="input-group">
            <label>Character Visual (Optional)</label>
            <input type="file" id="image-input" accept="image/*">
            <small style="color:#666">Upload a picture of what the AI looks like.</small>
        </div>

        <div class="input-group">
            <label>Your Description</label>
            <textarea id="user-desc" placeholder="Who are you in this story? (e.g. A young intern wearing a bright yellow raincoat)"></textarea>
        </div>

        <div class="input-group">
            <label>Groq API Key</label>
            <input type="password" id="api-key" placeholder="gsk_...">
        </div>

        <button class="start-btn" onclick="initChat()">START CONVERSATION</button>
    </div>

    <div id="output"></div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()" style="background:var(--main); border:none; padding: 0 20px; cursor:pointer; border-radius:4px;">SEND</button>
    </div>
</div>

<script>
    let messages = [];
    let base64Image = null;

    // Convert image to Base64 so AI can "see" it
    document.getElementById('image-input').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = function() { base64Image = reader.result; };
        reader.readAsDataURL(e.target.files[0]);
    });

    async function initChat() {
        const key = document.getElementById('api-key').value;
        const aiDesc = document.getElementById('ai-desc').value;
        const userDesc = document.getElementById('user-desc').value;

        if (!key) return alert("API Key required.");
        localStorage.setItem('groq_key', key);

        // System Prompt: Sets the rules and personas
        messages = [{
            role: "system",
            content: `You are in a roleplay. 
            YOUR PERSONA: ${aiDesc}. 
            USER'S PERSONA: ${userDesc}. 
            Stay in character. If an image was provided, that is your official appearance; refer to it naturally.`
        }];

        // If image exists, send it in the first message to "show" the AI what it looks like
        if (base64Image) {
            messages.push({
                role: "user",
                content: [
                    { type: "text", text: "[System: This is your visual reference. Acknowledge who you are based on this image and the description.]" },
                    { type: "image_url", image_url: { url: base64Image } }
                ]
            });
        }

        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('output').style.display = 'flex';
        document.getElementById('output').style.flexDirection = 'column';
        document.getElementById('input-area').style.display = 'flex';

        // Trigger the first response if no image was sent, otherwise the image logic handles it
        if (!base64Image) {
            sendMessage("Hello? Are you there?");
        } else {
            processAIResponse();
        }
    }

    async function sendMessage(overrideText) {
        const input = document.getElementById('user-input');
        const text = overrideText || input.value;
        if (!text) return;

        appendMsg(text, 'user-msg', 'YOU');
        input.value = "";

        messages.push({ role: "user", content: text });
        processAIResponse();
    }

    async function processAIResponse() {
        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json", 
                    "Authorization": `Bearer ${localStorage.getItem('groq_key')}` 
                },
                body: JSON.stringify({ 
                    model: "llama-3.2-11b-vision-preview", 
                    messages: messages, 
                    temperature: 0.7 
                })
            });

            const data = await res.json();
            const reply = data.choices[0].message.content;
            
            appendMsg(reply, 'ai-msg', 'CHARACTER');
            messages.push({ role: "assistant", content: reply });
        } catch (e) {
            console.error(e);
            appendMsg("Error connecting to the brain. Check your API key or connection.", 'ai-msg', 'SYSTEM');
        }
    }

    function appendMsg(text, cls, label) {
        const out = document.getElementById('output');
        const div = document.createElement('div');
        div.className = `msg ${cls}`;
        div.innerHTML = `<span class="msg-label">${label}</span>${text.replace(/\n/g, '<br>')}`;
        out.appendChild(div);
        out.scrollTop = out.scrollHeight;
    }
</script>

</body>
</html>
