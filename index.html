<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PERSONA CHAT - DUAL VISUALS</title>
    <style>
        :root { --main: #a29bfe; --bg: #0d0d0d; --panel: #1a1a1a; --user: #00ccff; --ai: #ff9933; }
        body { background: var(--bg); color: #ddd; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }

        #chat-container { width: 95%; max-width: 800px; height: 90vh; background: #111; border: 1px solid #333; display: flex; flex-direction: column; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* Setup Screen */
        #setup-screen { padding: 30px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
        .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 11px; color: var(--main); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        textarea, input { background: #1a1a1a; border: 1px solid #333; color: white; padding: 10px; border-radius: 4px; font-family: inherit; }
        textarea { height: 70px; resize: none; }
        
        /* Chat Display */
        #output { flex-grow: 1; overflow-y: auto; padding: 20px; display: none; scroll-behavior: smooth; }
        .msg { margin-bottom: 20px; max-width: 85%; line-height: 1.5; padding: 12px 16px; border-radius: 12px; position: relative; }
        .user-msg { align-self: flex-end; background: #222; border-right: 4px solid var(--user); margin-left: auto; }
        .ai-msg { align-self: flex-start; background: #1a1a1a; border-left: 4px solid var(--ai); }
        .msg-label { font-size: 10px; font-weight: bold; margin-bottom: 4px; display: block; opacity: 0.6; text-transform: uppercase; }

        #input-area { padding: 20px; background: #000; border-top: 1px solid #333; display: none; gap: 10px; }
        #user-input { flex-grow: 1; }
        
        .start-btn { background: var(--main); color: #000; border: none; padding: 15px; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 5px; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="setup-screen">
        <h2 style="color:var(--main); margin:0 0 10px 0;">PERSONA INITIALIZATION</h2>
        
        <div class="setup-grid">
            <div class="input-group">
                <label>AI Character (The Bot)</label>
                <textarea id="ai-desc" placeholder="Who is the AI? (Personality, job, etc.)"></textarea>
                <label style="margin-top:10px;">AI's Photo</label>
                <input type="file" id="ai-image" accept="image/*">
            </div>

            <div class="input-group">
                <label>Your Character (You)</label>
                <textarea id="user-desc" placeholder="Who are you playing? (Description, vibe)"></textarea>
                <label style="margin-top:10px;">Your Photo</label>
                <input type="file" id="user-image" accept="image/*">
            </div>
        </div>

        <div class="input-group" style="margin-top:10px;">
            <label>Groq API Key</label>
            <input type="password" id="api-key" placeholder="gsk_...">
        </div>

        <button class="start-btn" onclick="initChat()">START CONVERSATION</button>
    </div>

    <div id="output"></div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()" style="background:var(--main); border:none; padding: 0 20px; cursor:pointer; border-radius:4px; font-weight:bold;">SEND</button>
    </div>
</div>

<script>
    let messages = [];
    let aiBase64 = null;
    let userBase64 = null;

    // Helper to convert images
    function bindImage(elementId, callback) {
        document.getElementById(elementId).addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function() { callback(reader.result); };
            if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
        });
    }

    bindImage('ai-image', (res) => aiBase64 = res);
    bindImage('user-image', (res) => userBase64 = res);

    async function initChat() {
        const key = document.getElementById('api-key').value;
        const aiDesc = document.getElementById('ai-desc').value;
        const userDesc = document.getElementById('user-desc').value;

        if (!key) return alert("API Key required.");
        localStorage.setItem('groq_key', key);

        // System Prompt
        messages = [{
            role: "system",
            content: `Stay in character at all times.
            AI CHARACTER: ${aiDesc}. 
            USER CHARACTER: ${userDesc}. 
            The user will provide visual references for both characters. Use these visuals to describe actions and reactions.`
        }];

        // Package Visual Data
        let visualContext = {
            role: "user",
            content: [{ type: "text", text: "SYSTEM NOTICE: Here are the visual references for our session." }]
        };

        if (aiBase64) {
            visualContext.content.push({ type: "text", text: "This is what YOU (the AI) look like:" });
            visualContext.content.push({ type: "image_url", image_url: { url: aiBase64 } });
        }
        if (userBase64) {
            visualContext.content.push({ type: "text", text: "This is what I (the user) look like:" });
            visualContext.content.push({ type: "image_url", image_url: { url: userBase64 } });
        }

        if (aiBase64 || userBase64) messages.push(visualContext);

        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('output').style.display = 'flex';
        document.getElementById('output').style.flexDirection = 'column';
        document.getElementById('input-area').style.display = 'flex';

        sendMessage("Hello?");
    }

    async function sendMessage(textOverride) {
        const input = document.getElementById('user-input');
        const text = textOverride || input.value;
        if (!text) return;

        appendMsg(text, 'user-msg', 'YOU');
        if(!textOverride) input.value = "";

        messages.push({ role: "user", content: text });
        processAI();
    }

    async function processAI() {
        try {
            // FIND THIS SECTION:
const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: { 
        "Content-Type": "application/json", 
        "Authorization": `Bearer ${localStorage.getItem('groq_key')}` 
    },
    body: JSON.stringify({ 
        // CHANGE THIS LINE:
        model: "llama-3.2-11b-vision-preview", 
        messages: messages, 
        temperature: 0.8 
    })
});

            const data = await res.json();
            const reply = data.choices[0].message.content;
            appendMsg(reply, 'ai-msg', 'CHARACTER');
            messages.push({ role: "assistant", content: reply });
        } catch (e) {
            appendMsg("Connection error. Check API key.", 'ai-msg', 'SYSTEM');
        }
    }

    function appendMsg(text, cls, label) {
        const out = document.getElementById('output');
        const div = document.createElement('div');
        div.className = `msg ${cls}`;
        div.innerHTML = `<span class="msg-label">${label}</span>${text.replace(/\n/g, '<br>')}`;
        out.appendChild(div);
        out.scrollTop = out.scrollHeight;
    }
</script>

</body>
</html>
